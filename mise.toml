[settings]
dotfiles.default_mode = "symlink"

[dotfiles]
"~/.config/aerospace" = { source = "packages/aerospace" }
"~/.local/share/sounds" = { source = "packages/assets" }
"~/.config/borders" = { source = "packages/borders" }
"~/.config/ghostty" = { source = "packages/ghostty" }
"~/.config/git" = { source = "packages/git" }
"~/.hammerspoon" = { source = "packages/hammerspoon" }
"~/.config/homebrew" = { source = "packages/homebrew" }
"~/.config/karabiner" = { source = "packages/karabiner" }
"~/.config/nvim" = { source = "packages/nvim" }
"~/.config/octorus" = { source = "packages/octorus" }
"~/.config/p10k" = { source = "packages/p10k" }
"~/.config/sheldon" = { source = "packages/sheldon" }
"~/.config/sketchybar" = { source = "packages/sketchybar" }
"~/.config/tmux" = { source = "packages/tmux" }
"~/Library/Application Support/Code/User" = { source = "packages/vscode" }
"~/.config/yazi" = { source = "packages/yazi" }
"~/.config/zed" = { source = "packages/zed" }
"~/.config/zellij" = { source = "packages/zellij" }

# 実行時生成ファイル（ログ・ソケット・ローカル設定）がライブ側に混在するため、
# ディレクトリごとではなくファイル単位でリンクする
"~/.config/cmux" = { source = "packages/cmux", mode = "symlink-each" }
"~/.config/herdr" = { source = "packages/herdr", mode = "symlink-each" }

# zsh は ~/.zshenv（ホーム直下）と ~/.config/zsh に分かれる。
# config/ 配下は ~/.config/zsh にそのまま展開されるため、
# zsh が読み込めるようファイル名のドットを維持している。
"~/.config/zsh" = { source = "packages/zsh/config" }
"~/.zshenv" = { source = "packages/zsh/zshenv" }
"~/.zshenv.local" = { source = "packages/zsh/zshenv.local" }

# 保留:
#   claude    — ~/.claude が実データ入りの実ディレクトリのため対象外
#   rectangle — target が ~/RectangleConfig.json でよいか要確認（Stow 対象外だった）
