onboarding = false

[ui]
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
row_gap = 1

[ui.sidebar.spaces]
row_gap = 1

[ui.toast]
delivery = "terminal"

[keys]
prefix = "ctrl+s"

previous_workspace = "shift+ctrl+k"
next_workspace = "shift+ctrl+j"

previous_tab = "shift+ctrl+["
next_tab = "shift+ctrl+]"

# swap_pane のデフォルトは prefix+shift+h/j/k/l で workspace 移動とぶつかるため ctrl 側へ退避
swap_pane_left = "prefix+ctrl+h"
swap_pane_down = "prefix+ctrl+j"
swap_pane_up = "prefix+ctrl+k"
swap_pane_right = "prefix+ctrl+l"

[[keys.command]]
key = "prefix+y"
type = "popup"
command = "yazi"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+z"
type = "popup"
command = "zsh"
width = "85%"
height = "75%"

[[keys.command]]
key = "prefix+d"
type = "popup"
command = "hunk diff"
width = "90%"
height = "90%"

[experimental]
switch_ascii_input_source_in_prefix = false
kitty_graphics = true
