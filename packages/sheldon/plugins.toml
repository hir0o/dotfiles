# `sheldon` configuration file
# ----------------------------
#
# You can modify this file directly or you can use one of the following
# `sheldon` commands which are provided to assist in editing the config file:
#
# - `sheldon add` to add a new plugin to the config file
# - `sheldon edit` to open up the config file in the default editor
# - `sheldon remove` to remove a plugin from the config file
#
# See the documentation for more https://github.com/rossmacarthur/sheldon#readme

shell = "zsh"

[plugins]

# --- 基本ツール ---
[plugins.zsh-defer]
github = "romkatv/zsh-defer"

[plugins.powerlevel10k]
github = 'romkatv/powerlevel10k'

# --- 補完・入力支援 ---
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"

# compinit初期化（zsh-completionsの後に実行）
# 補完ファイルの検査（compaudit）は遅いので、dump が 24 時間以内なら -C で省く
[plugins.compinit]
inline = '''
autoload -Uz compinit
() {
  local dump="${ZDOTDIR:-$HOME}/.zcompdump"
  local -a fresh=($dump(N.mh-24))
  if (( $#fresh )); then
    compinit -C -d "$dump"
  else
    compinit -d "$dump"
    # 内容が変わらないと dump は書き換わらないため、次回の判定用に更新時刻を進める
    touch "$dump"
  fi
}
'''

[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"

# --- パッケージマネージャー抽象化 ---
[plugins.ni-zsh]
github = "azu/ni.zsh"
apply = ["defer"]

[plugins.zsh-autopair]
github = "hlissner/zsh-autopair"
apply = ["defer"]

# ↑↓キーで履歴検索
[plugins.zsh-history-substring-search]
github = "zsh-users/zsh-history-substring-search"
apply = ["defer"]

# --- ビジュアル・フィードバック（最後推奨） ---
[plugins.deja]
inline = '''
export DEJA_CYCLE_KEY='^[[1;2B'
if [[ -r "$HOME/.local/share/deja/init.zsh" ]]; then
  source "$HOME/.local/share/deja/init.zsh"
elif (( $+commands[deja] )); then
  eval "$(deja init zsh)"
fi
'''

# 必ず最後に読み込む（他のプラグインが定義したエイリアス等に色を付けるため）
[plugins.zsh-syntax-highlighting]
github = 'zsh-users/zsh-syntax-highlighting'
apply = ["defer"]

[templates]
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"
